<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乾茂的草稿箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 40px 0 20px;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        header h1 { font-size: 28px; }
        header p { color: #666; margin-top: 8px; font-size: 14px; }
        .draft {
            background: #fff;
            border-left: 4px solid #333;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 0 4px 4px 0;
        }
        .draft h2 { font-size: 18px; margin-bottom: 8px; }
        .draft .date { font-size: 12px; color: #999; }
        .draft p { margin-top: 8px; font-size: 15px; }
        code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 14px;
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 14px;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>乾茂的草稿箱</h1>
            <p>随手记，别在意格式</p>
        </header>

        <div class="draft">
            <h2>第一篇草稿</h2>
            <div class="date">2026-05-08</div>
            <p>这是我的线上草稿箱，用来记录各种零碎想法、代码片段、学习笔记。</p>
            <p>想写什么就写什么，没人在意。</p>
        </div>

        <div class="draft">
            <h2>使用方法</h2>
            <div class="date">2026-05-08</div>
            <p>直接编辑 <code>index.html</code> 文件，复制一个 <code>div.draft</code> 块，改成你的内容就行。</p>
            <pre>&lt;div class="draft"&gt;
  &lt;h2&gt;标题&lt;/h2&gt;
  &lt;div class="date"&gt;日期&lt;/div&gt;
  &lt;p&gt;内容...&lt;/p&gt;
&lt;/div&gt;</pre>
        </div>

        <footer>
            <p>qianmao1989.github.io &middot; 最后更新: 2026-05-08</p>
        </footer>
    </div>
</body>
</html>
