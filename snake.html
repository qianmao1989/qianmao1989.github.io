<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博贪吃蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }
        .game-wrapper {
            text-align: center;
        }
        h1 {
            color: #e040fb;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #e040fb, 0 0 20px #e040fb;
            letter-spacing: 4px;
        }
        #info {
            color: #00e5ff;
            font-size: 14px;
            margin-bottom: 12px;
            text-shadow: 0 0 6px #00e5ff;
        }
        canvas {
            border: 2px solid #e040fb;
            box-shadow: 0 0 15px #e040fb, inset 0 0 15px rgba(224, 64, 251, 0.1);
            display: block;
            margin: 0 auto;
        }
        #score {
            color: #76ff03;
            font-size: 18px;
            margin-top: 12px;
            text-shadow: 0 0 8px #76ff03;
        }
        #msg {
            color: #ff1744;
            font-size: 16px;
            margin-top: 8px;
            text-shadow: 0 0 8px #ff1744;
            min-height: 24px;
        }
        .back {
            color: #888;
            font-size: 12px;
            margin-top: 16px;
        }
        .back a { color: #00e5ff; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>赛博贪吃蛇</h1>
        <div id="info">方向键 / WASD 控制 · 吃豆得分</div>
        <canvas id="game" width="400" height="400"></canvas>
        <div id="score">得分：0</div>
        <div id="msg">按任意方向键开始</div>
        <div class="back"><a href="index.html">← 返回草稿箱</a></div>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const msgEl = document.getElementById("msg");

        const GRID = 20;
        const COLS = canvas.width / GRID;
        const ROWS = canvas.height / GRID;

        let snake, food, dir, nextDir, score, running, timer;

        function init() {
            snake = [{ x: 10, y: 10 }];
            dir = { x: 0, y: 0 };
            nextDir = { x: 0, y: 0 };
            score = 0;
            running = false;
            scoreEl.textContent = "得分：0";
            msgEl.textContent = "按任意方向键开始";
            placeFood();
            draw();
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
            for (let s of snake) {
                if (s.x === food.x && s.y === food.y) return placeFood();
            }
        }

        function draw() {
            // 背景
            ctx.fillStyle = "#0a0a0f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格
            ctx.strokeStyle = "rgba(128, 0, 255, 0.12)";
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 食物
            ctx.save();
            ctx.shadowColor = "#ff1744";
            ctx.shadowBlur = 15;
            ctx.fillStyle = "#ff1744";
            ctx.beginPath();
            ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 蛇
            for (let i = 0; i < snake.length; i++) {
                const s = snake[i];
                const bright = 1 - i / snake.length * 0.5;
                ctx.save();
                ctx.shadowColor = "#00e5ff";
                ctx.shadowBlur = i === 0 ? 15 : 8;
                ctx.fillStyle = i === 0 ? "#00e5ff" : `rgba(0, 229, 255, ${bright})`;
                ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
                ctx.restore();
            }
        }

        function update() {
            dir = { ...nextDir };
            const head = {
                x: (snake[0].x + dir.x + COLS) % COLS,
                y: (snake[0].y + dir.y + ROWS) % ROWS
            };

            // 撞自己
            for (let s of snake) {
                if (s.x === head.x && s.y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = "得分：" + score;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            running = false;
            clearInterval(timer);
            msgEl.textContent = "游戏结束！得分 " + score + " · 按任意方向键重新开始";
            init();
        }

        function setDir(x, y) {
            // 不能反向
            if (dir.x === -x && dir.y === -y) return;
            nextDir = { x, y };
            if (!running) {
                running = true;
                msgEl.textContent = "";
                timer = setInterval(update, 120);
            }
        }

        document.addEventListener("keydown", function (e) {
            switch (e.key) {
                case "ArrowUp": case "w": case "W": setDir(0, -1); e.preventDefault(); break;
                case "ArrowDown": case "s": case "S": setDir(0, 1); e.preventDefault(); break;
                case "ArrowLeft": case "a": case "A": setDir(-1, 0); e.preventDefault(); break;
                case "ArrowRight": case "d": case "D": setDir(1, 0); e.preventDefault(); break;
            }
        });

        init();
    </script>
</body>
</html>
